# Nombre de la aplicación Spring Boot
spring.application.name=hoteles

# Puerto en el que se ejecutará el servidor
server.port=84

# URL de conexión a la base de datos Oracle SID es xe y orcl
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/orcl 
# Nombre de usuario para la conexión a la base de datos
spring.datasource.username=ADMIN
# Contraseña para la conexión a la base de datos
spring.datasource.password=123

# Clase del controlador JDBC para Oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de Hibernate para manejar el esquema de la base de datos
spring.jpa.hibernate.ddl-auto=update
# Esta opción permite a Hibernate mostrar las consultas SQL que se ejecutan en la base de datos
spring.jpa.show-sql=true
# Formatea las consultas SQL para que sean más legibles
spring.jpa.properties.hibernate.format_sql=true