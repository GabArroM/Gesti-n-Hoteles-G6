<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Lista de Personas</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="container mt-5">
            <h2>Lista de Personas</h2>
            <a class="btn btn-success" th:href="@{/persona/agregar}">Agregar</a>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="persona : ${personas}">
                        <td th:text="${persona.idPersona}"></td>
                        <td th:text="${persona.nombre}"></td>
                        <td>
                           
                            <a class="btn btn-danger" th:href="@{/persona/eliminar/{idPersona}(idPersona=${persona.idPersona})}">Eliminar</a>
                            <a class="btn btn-warning" th:href="@{/persona/modificar/{idPersona}(idPersona=${persona.idPersona})}">Modificar</a>
                            
                            
                            
                            <!-- Botón para abrir el modal -->
                            <button type="button" class="btn btn-info" 
                                    data-toggle="modal" 
                                    th:data-target="'#modalPersona' + ${persona.idPersona}">
                                Ver detalles
                            </button>

                            <!-- Modal -->
                            <div class="modal fade" 
                                 th:id="'modalPersona' + ${persona.idPersona}" 
                                 tabindex="-1" role="dialog" 
                                 aria-labelledby="modalLabel" aria-hidden="true">
                                <div class="modal-dialog" role="document">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title" id="modalLabel">Detalles de Persona</h5>
                                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                                <span aria-hidden="true">&times;</span>
                                            </button>
                                        </div>
                                        <div class="modal-body">
                                            <p><strong>ID:</strong> <span th:text="${persona.idPersona}"></span></p>
                                            <p><strong>Nombre:</strong> <span th:text="${persona.nombre}"></span></p>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
