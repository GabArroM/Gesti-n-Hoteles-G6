<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modificar Persona</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Modificar Persona</h2>
    <form th:action="@{/persona/guardar}" th:object="${persona}" method="post">
        <div class="mb-3">
            <input type="hidden" th:field="*{idPersona}" />
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ingresa el nombre" required>
        </div>

        <button type="submit" class="btn btn-primary">Actualizar</button>
        <a href="#" th:href="@{/persona/verpersonas}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>



</body>
</html>
